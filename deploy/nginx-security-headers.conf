# ExoMarketing security response headers.
# Deploy to the server as: /etc/nginx/snippets/exo-security-headers.conf
#
# IMPORTANT (nginx add_header inheritance): a `location` block that defines ANY
# add_header of its own does NOT inherit add_header from its parent. So this
# snippet must be `include`d at the `server` level AND again inside the
# `location /assets/` block (which sets its own Cache-Control header).

# Force HTTPS for 1 year, including subdomains. Add `; preload` only if you
# intend to submit the domain to the HSTS preload list (hard to undo).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Clickjacking: disallow the site being framed (CSP frame-ancestors backs this up).
add_header X-Frame-Options "DENY" always;

# Stop browsers from MIME-sniffing responses away from the declared Content-Type.
add_header X-Content-Type-Options "nosniff" always;

# Limit referrer leakage to other origins.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Drop access to browser features the site does not use.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), midi=(), payment=(), usb=()" always;

# Legacy XSS auditor flag (ignored by modern browsers; set to satisfy scanners).
add_header X-XSS-Protection "1; mode=block" always;

# Content-Security-Policy.
#   script-src 'self'                      -> only our bundled JS runs (no inline scripts).
#   style-src  'self' 'unsafe-inline'      -> 'unsafe-inline' required for React inline style={{}} attributes.
#   font-src   'self'                      -> self-hosted woff2 in /fonts/ (no third party).
#   img-src    'self' data:                -> local uploads + any data-URI images (incl. the SVG noise texture).
#   connect-src 'self'                     -> the /api/contact fetch.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'" always;
